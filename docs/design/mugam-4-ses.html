<!DOCTYPE html><html lang="az"><head><meta charset="utf-8"><title>Mugam 4</title><style>
* { box-sizing: border-box; margin: 0; }
body {
  background: #0D0D0D;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  display: flex; justify-content: center; align-items: flex-start;
  padding: 40px;
}
.stage { display: flex; }
.phone + .phone { margin-left: 30px; }
.phone {
  width: 320px; height: 630px;
  background: #1A1A1A;
  border-radius: 14px;
  padding: 32px 22px 22px;
  display: flex; flex-direction: column;
}
p { margin: 0; }
.mut { color: #8A8A85; }
.dim { color: #5F5F5C; }
.pri { color: #F5F3ED; }
.sec { color: #A8A8A2; }
.gold { color: #E09A2B; }
.label { font-size: 13px; letter-spacing: 1.5px; color: #8A8A85; margin: 26px 0 12px; }
.cap { font-size: 14px; letter-spacing: 1.8px; color: #E09A2B; margin-bottom: 30px; }
.bar { border-left: 4px solid #E09A2B; padding: 2px 0 2px 16px; }
.bar.off { border-left-color: #3A3A38; }
.row { display: flex; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid #262624; }
.row:last-of-type { border-bottom: none; }
.tabs { margin-top: auto; display: flex; justify-content: space-between; padding: 0; }
.tabs span { font-size: 15px; color: #8A8A85; }
.av { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid #3A3A38;
  display: flex; align-items: center; justify-content: center; font-size: 13px; color: #A8A8A2; flex-shrink: 0; }
.av.on { border-color: #E09A2B; color: #E09A2B; }
.av { font-size: 14px; }
.person { display: flex; align-items: center; margin-bottom: 16px; }
.person > div:last-child { margin-left: 17px; }
.btn { border: 1.5px solid #3A3A38; color: #C8C8C2; border-radius: 10px;
  padding: 17px; text-align: center; font-size: 16px; margin-bottom: 14px; }
.btn.g { border-color: #E09A2B; color: #E09A2B; }
.btn.f { background: #C1811F; color: #F5F3ED; border-color: #C1811F; }
.pill { align-self: flex-start; margin-top: 16px; border: 1.5px solid #7FA84A;
  color: #9BC46A; font-size: 15px; padding: 8px 16px; border-radius: 22px; }
.fld { border: 1.5px solid #3A3A38; border-radius: 10px; padding: 13px 16px; margin-bottom: 13px; }
.fld p:first-child { font-size: 12px; letter-spacing: 1.6px; color: #8A8A85; }
.fld p:last-child { font-size: 17px; color: #F5F3ED; margin-top: 6px; }
.opt { border: 1.5px solid #3A3A38; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px;
  font-size: 15px; color: #C8C8C2; line-height: 1.45; }
.opt.on { border-color: #E09A2B; color: #E09A2B; }
.ta { border: 1.5px solid #3A3A38; border-radius: 10px; padding: 14px 16px; font-size: 15px;
  color: #5F5F5C; min-height: 80px; }
.ev { display: flex; margin-bottom: 22px; }
.ev > div:last-child { margin-left: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #3A3A38; margin-top: 7px; flex-shrink: 0; }
.dot.on { background: #E09A2B; }
.chip { border: 1.5px solid #3A3A38; border-radius: 22px; padding: 9px 16px; font-size: 15px; color: #A8A8A2; display: inline-block; margin: 0 8px 10px 0; }
.chip.on { border-color: #E09A2B; color: #E09A2B; }
.mic { width: 76px; height: 76px; border-radius: 50%; background: #C1811F; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto; }
.mic.rec { background: #C0392B; }
.wave { display: flex; align-items: center; justify-content: center; height: 44px; }
.wave i { display: inline-block; width: 3px; margin: 0 2px; background: #E09A2B; border-radius: 2px; }
.trio { display: flex; }
.trio > div { flex: 1; border: 1.5px solid #3A3A38; border-radius: 10px; padding: 14px 0; text-align: center; font-size: 15px; color: #C8C8C2; }
.trio > div + div { margin-left: 10px; }
.trio > div.f { background: #C1811F; color: #F5F3ED; border-color: #C1811F; }
</style></head><body><div class="stage">

<div class="phone">
  <p class="cap">YENİ TƏDBİR</p>
  <p class="pri" style="font-size:30px;">14 avqust</p>
  <p class="mut" style="font-size:16px; margin-top:6px;">cümə</p>

  <p class="label" style="margin-top:30px;">KİMİ ÇAĞIRIRSAN</p>
  <div>
    <span class="chip on">Teymur ✓</span>
    <span class="chip on">Ramil ✓</span>
    <span class="chip">+ əlavə et</span>
  </div>
  <p class="mut" style="font-size:14px; margin-top:4px;">keçən dəfəki heyət</p>

  <div style="margin-top:auto;">
    <div class="mic">🎤</div>
    <p class="mut" style="font-size:14px; text-align:center; margin-top:12px;">danış — və göndər</p>
    <div class="btn" style="margin-top:22px; margin-bottom:0;">✎ Ətraflı yaz</div>
  </div>
</div>

<div class="phone">
  <p class="cap">YAZILIR…</p>
  <p class="pri" style="font-size:30px;">14 avqust</p>
  <p class="mut" style="font-size:16px; margin-top:6px;">Teymur, Ramil</p>

  <div style="margin-top:auto; margin-bottom:auto;">
    <div class="wave">
      <i style="height:10px"></i><i style="height:22px"></i><i style="height:34px"></i><i style="height:18px"></i>
      <i style="height:40px"></i><i style="height:26px"></i><i style="height:12px"></i><i style="height:30px"></i>
      <i style="height:38px"></i><i style="height:16px"></i><i style="height:24px"></i><i style="height:8px"></i>
      <i style="height:20px"></i><i style="height:32px"></i><i style="height:14px"></i>
    </div>
    <p class="gold" style="font-size:22px; text-align:center; margin-top:14px;">0:07</p>
    <div class="mic rec" style="margin-top:26px;">⏹</div>
    <p class="mut" style="font-size:14px; text-align:center; margin-top:12px;">dayandırmaq üçün toxun</p>
  </div>
</div>

<div class="phone">
  <p class="cap">HAZIRDIR</p>
  <p class="pri" style="font-size:30px;">14 avqust</p>
  <p class="mut" style="font-size:16px; margin-top:6px;">Teymur, Ramil</p>

  <div class="bar" style="margin-top:34px;">
    <div class="wave" style="justify-content:flex-start; height:34px;">
      <i style="height:8px"></i><i style="height:18px"></i><i style="height:28px"></i><i style="height:14px"></i>
      <i style="height:32px"></i><i style="height:20px"></i><i style="height:10px"></i><i style="height:24px"></i>
      <i style="height:30px"></i><i style="height:12px"></i><i style="height:22px"></i>
    </div>
    <p class="sec" style="font-size:16px; margin-top:8px;">0:14</p>
  </div>

  <div style="margin-top:auto;">
    <div class="trio" style="margin-bottom:14px;">
      <div>▶ Dinlə</div>
      <div>↻ Yenidən</div>
    </div>
    <div class="btn f" style="margin-bottom:0;">Göndər</div>
  </div>
</div>

</div></body></html>
